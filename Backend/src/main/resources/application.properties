spring.application.name=skillloop-ai

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/skillloop_ai
spring.datasource.username=postgres
spring.datasource.password=abhi0618
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI APIs
huggingface.api.key=YOUR_HUGGINGFACE_API_KEY
gemini.api.key=YOUR_GEMINI_API_KEY

# JWT
jwt.secret=your-super-secret-jwt-key-minimum-32-characters-long

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html